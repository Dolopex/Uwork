name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Revisar configuración de Django
        run: python manage.py check --deploy --fail-level ERROR

      - name: Ejecutar pruebas
        run: python manage.py test

  # §6.5.3 — "Auditoría automatizada de dependencias"
  # Herramientas sugeridas por el documento: pip-audit o safety.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auditar dependencias con pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Buscar secretos expuestos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
