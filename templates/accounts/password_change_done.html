{% extends 'base.html' %}
{% block title %}Contraseña actualizada — U-Work{% endblock %}
{% block content %}
<div style="max-width:520px; margin:0 auto; text-align:center; padding:40px 16px;">
    <div style="width:64px;height:64px;border-radius:18px;background:rgba(5,150,105,0.12);display:inline-flex;align-items:center;justify-content:center;font-size:1.7rem;color:#059669;margin-bottom:16px;">
        <i class="bi bi-check-lg"></i>
    </div>
    <h4 style="font-weight:800; color:var(--text); margin:0 0 8px;">Contraseña actualizada</h4>
    <p style="font-size:0.87rem; color:var(--text-secondary);">
        Tu contraseña fue cambiada. Por seguridad, las demás sesiones se cerraron.
    </p>
    <a href="{% url 'accounts:profile' %}" class="btn"
       style="background:var(--primary); color:#fff; border:none; border-radius:12px; font-weight:700; padding:12px 26px; margin-top:18px;">
        <i class="bi bi-arrow-left"></i> Volver al perfil
    </a>
</div>
{% endblock %}
