{% comment %}Base para las pantallas de recuperacion y cambio de contraseña (R2, §6.5.3).{% endcomment %}
{% extends 'accounts/_verify_base.html' %}
{% block extra_css %}
<style>
    .v-field { margin-bottom: var(--space-4); text-align: left; }
    .v-errors {
        background: var(--state-danger-soft);
        border: 1px solid var(--state-danger);
        border-radius: var(--radius-md);
        padding: var(--space-3) var(--space-4);
        margin-bottom: var(--space-4);
        font-size: var(--fs-sm); color: var(--state-danger); text-align: left;
    }
    .v-errors ul { margin: 0; padding-left: 18px; }
    .v-help { font-size: var(--fs-xs); color: var(--text-secondary); margin-top: 5px; text-align: left; }
    .v-actions-left { margin-top: var(--space-5); display: grid; gap: var(--space-2); }
</style>
{% endblock %}
